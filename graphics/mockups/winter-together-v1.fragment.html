const messages=[{name:'Пользователь 2',text:'На каток сегодня? Там уже включили огоньки.',time:'09:32'},{name:'Пользователь 1',text:'Да! Возьмём термос с какао?',time:'09:34'},{name:'Пользователь 2',text:'И варежки. Обе пары :)',time:'09:35'}];
function message(m){return `<div class="message ${m.name==='Пользователь 1'?'me':''}"><div class="sender">${cat(m.name==='Пользователь 2',m.name==='Пользователь 1')}<span>${m.name}</span>${m.name==='Пользователь 1'?`<button class="gear" data-message-menu aria-label="Действия с сообщением">${icon('settings')}</button>`:''}</div><div class="bubble"><p>${esc(m.text)}</p><time>${m.time}</time><div style="clear:both"></div></div></div>`}
function chat(){return title('Общий чат',false)+`<p class="caption">Наш маленький тёплый уголок</p><div class="datepill"><span>23 декабря</span></div><div class="chatbody">${messages.map(message).join('')}<div class="gather"><span>${icon('heart')} Общий сбор · принято</span><strong>На каток вдвоём</strong><p>Сегодня · 19:00–20:30</p><button data-detail="На каток вдвоём">Посмотреть встречу →</button></div><div class="message me"><div class="sender">${cat(false,true)}<span>Пользователь 1</span><button class="gear" data-message-menu aria-label="Действия с сообщением">${icon('settings')}</button></div><div class="bubble"><p>Договорились!</p><time>09:41</time></div></div><div class="footprints" aria-hidden="true">${icon('paw-print').repeat(3)}</div></div><form class="composer"><input aria-label="Сообщение" placeholder="Написать сообщение…" required maxlength="500"><button aria-label="Отправить">${icon('arrow-up')}</button></form>`}
function plans(){return title('Планы')+`<div class="chips"><button class="chip selected">Зимние</button><button class="chip" data-more>Путешествия</button><button class="chip" data-more>Ещё ${icon('chevron-down')}</button></div>`+season()+['Уехать в домик в лесу','Устроить вечер печенья','Увидеть северное сияние'].map((s,i)=>`<button class="notecard ${i===0?'green':''}" data-detail="${s}"><strong>${s}</strong><p>${['Пледы, снег за окном и никаких дедлайнов.','Найти рецепт и собрать всех на кухне.','Большая мечта на маленькой карточке.'][i]}</p><small>${i+2} комментария</small></button>`).join('')}
function invites(){return title('Зовут')+`<p class="caption" style="margin-bottom:16px">Одно тёплое приглашение</p>`+event('Прогулка за городом','Суббота, 26.12 · 12:00','meeting')+`<p class="caption" style="margin:12px 0">Пользователь 2 приглашает тебя</p><button class="action" data-accept>Принять приглашение</button><div class="undated"><h2>История</h2>${event('На каток вдвоём','Принято · 23 декабря','meeting')}</div>`}
function settings(){return title('Настройки',false)+`<div class="settingrow"><span>Отображаемое имя</span><span>Пользователь 1</span></div><div class="settingrow"><span>Зима вместе</span><input type="checkbox" checked disabled aria-label="Зимняя тема включена"></div><label class="settingrow"><span>Падающий снег</span><input data-snow type="checkbox" ${snow?'checked':''}></label><div class="season" style="margin-top:22px"><div class="eyebrow">kotiki team</div><strong>Пусть дома<br>будет тепло</strong>${forest()}</div>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icons(){globalThis.lucide?.createIcons({attrs:{'stroke-width':1.7}})}
function persist(){window.openai?.setWidgetState?.({modelContent:{design:'Зима вместе',screen,snow},privateContent:{}})?.catch(()=>{})}
function render(){if(!['board','notes','calendar','chat','plans','invites','settings'].includes(screen))screen='board';main.innerHTML=({board,notes,calendar,chat,plans,invites,settings}[screen])();root.querySelectorAll('[data-screen]').forEach(b=>{b.classList.toggle('active',b.dataset.screen===screen);if(b.dataset.screen===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});icons()}
function openDialog(name,html){lastFocus=document.activeElement;root.querySelector('#kw-dialogtitle').textContent=name;root.querySelector('.dialogbody').innerHTML=html;root.querySelector('.overlay').hidden=false;icons();root.querySelector('[data-close]').focus()}
function closeDialog(){root.querySelector('.overlay').hidden=true;lastFocus?.focus()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))return closeDialog();if(b.dataset.screen){if(b.dataset.screen==='gathering'){openDialog('Собрать собрание котиков','<p>Пользователь 1 и Пользователь 2</p><p>23 декабря · 19:00–20:30</p><textarea aria-label="Идея встречи" placeholder="Что будем делать вместе?"></textarea><button class="action" data-draft>Создать приглашение</button>');return}screen=b.dataset.screen;render();persist()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.mode){overview=b.dataset.mode==='overview';render()}if(b.dataset.week){week=Math.max(-1,Math.min(1,week+Number(b.dataset.week)));render()}if(b.dataset.day){selectedDay=Number(b.dataset.day);render()}if(b.dataset.group){notesGroup=b.dataset.group;render()}if(b.hasAttribute('data-note')){const name=b.dataset.note;openDialog(name,`<p class="caption">Сохраняется автоматически · ${notesGroup==='Личное'?'на телефоне':'видно обоим'}</p><textarea aria-label="Текст заметки" data-editor="${name}">${esc(noteDrafts[name]||'Каток под открытым небом\nИспечь имбирное печенье\nДень без будильников')}</textarea><div class="chips"><button class="chip" data-format>Текст</button><button class="chip" data-format>Чек-лист</button><button class="chip" data-note-menu>Переместить</button></div>`)}if(b.dataset.detail)openDialog(b.dataset.detail,`<p>23 декабря · 19:00–20:30</p><p>${cats()} Пользователь 1 и Пользователь 2</p><p>Термос с какао, тёплые варежки и время вместе.</p><button class="action" data-edit>Редактировать</button>`);if(b.hasAttribute('data-edit'))openDialog('Редактирование','<textarea aria-label="Описание">Термос с какао, тёплые варежки и время вместе.</textarea><button class="action" data-draft>Готово</button>');if(b.hasAttribute('data-draft'))closeDialog();if(b.hasAttribute('data-add'))openDialog(screen==='notes'?'Новая заметка':'Что запланируем?','<textarea aria-label="Новая запись" placeholder="Напиши здесь…"></textarea><button class="action" data-draft>Готово</button>');if(b.hasAttribute('data-archive'))openDialog('Архив заметок','<p>Здесь будут заметки, которые ты уберёшь в архив.</p>');if(b.hasAttribute('data-more')||b.hasAttribute('data-note-menu'))openDialog('Группы','<div class="chips"><button class="chip" data-pick>Зима</button><button class="chip" data-pick>Дом</button><button class="chip" data-pick>Личное</button></div>');if(b.hasAttribute('data-pick')){notesGroup=b.textContent;closeDialog();if(screen==='notes')render()}if(b.hasAttribute('data-message-menu'))openDialog('Сообщение','<button class="chip" data-edit>Редактировать</button><button class="chip" data-remove>Удалить</button>');if(b.hasAttribute('data-remove')){closeDialog();openDialog('Удалить сообщение?','<p>Демонстрация меню зимней темы.</p><button class="action" data-draft>Закрыть</button>')}if(b.hasAttribute('data-accept')){b.textContent='Приглашение принято';b.disabled=true}if(b.hasAttribute('data-month'))openDialog('Календарь','<p>В макете показан декабрь 2026. Нажми на день, чтобы посмотреть его оформление.</p>');if(b.hasAttribute('data-format')){const ta=root.querySelector('[data-editor]');if(ta){ta.value+='\n☐ ';ta.focus()}}});
root.addEventListener('change',e=>{if(e.target.matches('.task input'))e.target.closest('.task').classList.toggle('done',e.target.checked);if(e.target.matches('[data-snow]')){snow=e.target.checked;root.classList.toggle('snow-off',!snow);persist()}});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]'))root.querySelectorAll('.notecard').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(e.target.value.toLowerCase()));if(e.target.matches('[data-editor]'))noteDrafts[e.target.dataset.editor]=e.target.value});
root.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(!input?.value.trim())return;messages.push({name:'Пользователь 1',text:input.value.trim(),time:'09:42'});render()});
root.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'&&!root.querySelector('.overlay').hidden){const all=[...root.querySelector('.dialog').querySelectorAll('button,input,textarea')].filter(x=>!x.disabled),first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
root.querySelector('.snowzone').innerHTML=Array.from({length:44},(_,i)=>`<span class="snowparticle ${i%3===0?'powder':''}" style="--left:${(i*37%96)+1}%;--size:${12+(i*7%14)}px;--duration:${18+(i*7%15)}s;--delay:-${(i*13.1)%32}s;--sway:${3+i%4}s;--opacity:${.28+(i%4)*.12};--static-top:${i*23%94}%"><span>${i%3===0?'':icon('snowflake')}</span></span>`).join('');
const phone=root.querySelector('.phone');
const sizeObserver=new ResizeObserver(()=>root.style.setProperty('--snow-travel',`${phone.offsetHeight+35}px`));sizeObserver.observe(phone);
root.addEventListener('click',e=>{if(e.target.closest('[data-snow-toggle]')){snow=!snow;root.classList.toggle('snow-off',!snow);render();persist()}});
document.addEventListener('visibilitychange',()=>root.classList.toggle('motion-paused',document.hidden));
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s?.screen){screen=s.screen;render()}});
render();if(globalThis.Tweak){const options={snow:true};const tweak=new Tweak({container:root,onChange:()=>{snow=options.snow;root.classList.toggle('snow-off',!snow)}});tweak.addToggle(options,'snow',{label:'Падающий снег'})}
})();
</script>
